[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laim-andes"
version = "0.2.0"
description = "LAIM anomaly detection for multi-agent AI systems (LumiMAS-based)"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.43,<2",
    "jax>=0.11,<0.12",
    "flax>=0.12,<0.13",
    "optax>=0.2,<0.3",
    "torch>=2.6",
    "sentence-transformers>=5,<6",
    "transformers>=5,<6",
    "scikit-learn>=1.9,<2",
    "altair>=6,<7",
    "vl-convert-python>=1.9",
    "psutil>=7",
    "pyarrow>=21",
    "tqdm>=4.70",
    "pandas>=2.2",
    "numpy>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pytest-timeout>=2",
]

[tool.setuptools.packages.find]
include = ["ars*", "laim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "characterization: pins current behavior (may pin known bugs; see finding marker)",
    "characterization_bug: pins KNOWN-BUGGY behavior; expected to change when the referenced finding is fixed",
    "slow: excluded from `make test` (runs in `make test-all`)",
    "gpu: requires a GPU",
]
timeout = 300
filterwarnings = ["ignore::DeprecationWarning"]
